name: chaos-release-gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci || npm install

      - name: Build system
        run: npm run build || echo "no build step"

  chaos-validation:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci || npm install

      - name: Run Chaos Gate (Light)
        run: |
          node -e "
          const { ChaosHarness } = require('./infra/chaos/chaosHarness');
          const { ChaosRunner } = require('./infra/chaos/chaosRunner');

          const harness = new ChaosHarness();
          const runner = new ChaosRunner(harness);

          const scenarios = ChaosHarness.presets().light;

          runner.run(scenarios).then(results => {
            console.log('CHAOS REPORT:', JSON.stringify(results, null, 2));

            const failed = results.some(r => !r.passed);
            if (failed) {
              console.error('CHAOS GATE FAILED');
              process.exit(1);
            }

            console.log('CHAOS GATE PASSED');
          }).catch(err => {
            console.error(err);
            process.exit(1);
          });
          "

  deploy-gate:
    runs-on: ubuntu-latest
    needs: chaos-validation

    steps:
      - name: Gate Approval
        run: echo "System passed chaos validation. Ready for GitOps deployment via ArgoCD."
