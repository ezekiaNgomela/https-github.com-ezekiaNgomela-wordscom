# WordCom Production Deployment (Render)
# Phase 35 - Production Hardening

services:
  - type: web
    name: wordcom-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: JWT_REFRESH_SECRET
        sync: false

      - key: SENDGRID_API_KEY
        sync: false

      - key: SMTP_HOST
        sync: false

      - key: SMTP_USER
        sync: false

      - key: SMTP_PASS
        sync: false

      - key: FIREBASE_API_KEY
        sync: false

      - key: FIREBASE_AUTH_DOMAIN
        sync: false

      - key: FIREBASE_PROJECT_ID
        sync: false

      - key: OPENAI_API_KEY
        sync: false
