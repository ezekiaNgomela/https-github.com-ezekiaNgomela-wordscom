apiVersion: v1
kind: Namespace
metadata:
  name: wordscom-production
---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: wordscom-gateway
  namespace: wordscom-production
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: wordscom-vs
  namespace: wordscom-production
spec:
  hosts:
    - "*"
  gateways:
    - wordscom-gateway
  http:
    - route:
        - destination:
            host: wordscom-service
            subset: stable
          weight: 90
        - destination:
            host: wordscom-service
            subset: canary
          weight: 10
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: wordscom-dr
  namespace: wordscom-production
spec:
  host: wordscom-service
  subsets:
    - name: stable
      labels:
        version: stable
    - name: canary
      labels:
        version: canary
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: wordscom-rollout
  namespace: wordscom-production
spec:
  replicas: 4
  strategy:
    canary:
      steps:
        - setWeight: 10
        - pause: { duration: 30s }
        - setWeight: 50
        - pause: { duration: 60s }
        - setWeight: 100
  selector:
    matchLabels:
      app: wordscom
  template:
    metadata:
      labels:
        app: wordscom
        version: stable
    spec:
      containers:
        - name: wordscom
          image: wordscom:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: wordscom-latency-chaos
  namespace: wordscom-production
spec:
  action: delay
  mode: all
  selector:
    labelSelectors:
      app: wordscom
  delay:
    latency: "100ms"
    correlation: "50"
    jitter: "30ms"
  duration: "60s"
