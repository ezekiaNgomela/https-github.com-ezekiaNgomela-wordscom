apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: adaptive-intelligence-engine
  namespace: monitoring
data:
  adaptive.yaml: |
    # ---------------------------------------------
    # Adaptive Intelligence Layer (Phase 34)
    # ---------------------------------------------
    # This layer does NOT execute remediation.
    # It adjusts thresholds and recommendations
    # based on observed system behavior.

    mode: "recommendation_only"

    signal_sources:
      prometheus:
        enabled: true
        query_interval_seconds: 15

    metrics:
      latency_ms:
        baseline: 200
        max_threshold: 1000
        adaptation_rate: 0.05

      error_rate:
        baseline_percent: 1
        max_threshold_percent: 10
        adaptation_rate: 0.1

      queue_depth:
        baseline: 50
        max_threshold: 500
        adaptation_rate: 0.08

    adaptation_logic:
      strategy: "exponential_moving_average"
      sensitivity: "medium"

      rules:
        - name: increase_thresholds_under_stability
          condition:
            error_rate_below_percent: 0.5
            latency_stable_minutes: 10
          action:
            type: "relax_thresholds"
            factor: 1.1

        - name: tighten_thresholds_under_instability
          condition:
            error_rate_above_percent: 5
            latency_spike_detected: true
          action:
            type: "tighten_thresholds"
            factor: 0.85

    feedback_loop:
      enabled: true
      source: "prometheus + incident-controller + chaos-runner"
      evaluation_window_minutes: 15

    outputs:
      - type: "metrics_adjustment_recommendation"
      - type: "slo_tuning_suggestion"
      - type: "incident_risk_score"

    safety_constraints:
      max_change_per_cycle_percent: 15
      require_human_review_for_production: true
      never_auto_apply: true

    audit:
      log_all_adjustments: true
      immutable_history: true
