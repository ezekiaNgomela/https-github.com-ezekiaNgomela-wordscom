apiVersion: v1
kind: Namespace
metadata:
  name: vault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
        - name: vault
          image: hashicorp/vault:1.15
          args:
            - "server"
            - "-dev"
          ports:
            - containerPort: 8200
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              value: "root"
            - name: VAULT_DEV_LISTEN_ADDRESS
              value: "0.0.0.0:8200"
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault
spec:
  selector:
    app: vault
  ports:
    - port: 8200
      targetPort: 8200
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: vault
data:
  config.hcl: |
    ui = true

    listener "tcp" {
      address = "0.0.0.0:8200"
      tls_disable = 1
    }

    storage "inmem" {}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-agent-injector
  namespace: vault
data:
  injector.hcl: |
    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role = "wordscom-role"
        }
      }

      sink "file" {
        config = {
          path = "/vault/secrets"
        }
      }
    }

    template {
      destination = "/vault/secrets/env"
      contents = <<EOT
{{- with secret "secret/data/wordscom" -}}
JWT_SECRET={{ .Data.data.JWT_SECRET }}
DATABASE_URL={{ .Data.data.DATABASE_URL }}
REDIS_URL={{ .Data.data.REDIS_URL }}
{{- end }}
EOT
    }
