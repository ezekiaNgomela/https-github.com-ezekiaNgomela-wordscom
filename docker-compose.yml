version: "3.9"

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - ai-service
      - document-service
      - conversion-service
      - redis

  ai-service:
    build: ./services/ai-orchestrator-service
    ports:
      - "4001:4000"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  document-service:
    build: ./services/document-service
    ports:
      - "4002:4000"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  conversion-service:
    build: ./services/conversion-service
    ports:
      - "4003:4000"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
